name: Update formula

# Follows gitaway's latest full release (never a pre-release). Needs no
# secrets: the script verifies each archive's attestation, then this job
# commits with the repository's own token.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "gitaway version (default: the latest release)"
        required: false

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update the formula
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/update-formula.py ${VERSION:+"$VERSION"}
      - name: Commit and test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Already up to date."
            exit 0
          fi
          version="$(sed -n 's|.*/releases/download/v\([0-9.]*\)/.*|\1|p' Formula/gitaway.rb | head -n 1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "update: gitaway $version"
          git push
          gh workflow run test.yml --ref main
